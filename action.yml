name: 'Tencent COS Action'
description: 'GitHub Action for Tencent COS CLI (coscli)'
author: 'zkqiang <zkqiang@126.com>'
branding:
  icon: 'cloud'
  color: 'blue'
inputs:
  commands:
    description: 'Sequential coscli commands, one command per line. Use cos://default/... to target the configured bucket.'
    required: true
  secret_id:
    description: 'Tencent cloud SecretId, from: https://console.cloud.tencent.com/cam/capi'
    required: true
  secret_key:
    description: 'Tencent cloud SecretKey, from: https://console.cloud.tencent.com/cam/capi'
    required: true
  bucket:
    description: 'COS bucket name'
    required: true
  region:
    description: 'COS bucket region, detail: https://cloud.tencent.com/document/product/436/6224'
    required: true
  coscli_version:
    description: 'coscli release tag such as v1.0.8. Defaults to the latest release when omitted.'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
